<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
        }
    </style>
</head>
<body>
  <h1>color changer system</h1>  
  <p>please click on the button to change the background</p>
  <button onclick="changecolor()">change the color</button>
  <script>
    function changecolor(){
        let randomColor="#"+Math.floor(Math.random()*1676315).toString(16).padStart(6,"0");
         
        document.body.style.backgroundColor = randomColor;
        
    }
 

  </script>
</body>
</html>
